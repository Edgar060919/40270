<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="javascript-02.css">
</head>
<body>

    <div class="contenedor">
        <h1>Calculadora</h1>

        <input type="text" id="resultado" readonly>

        <div class="botones">
            <button onclick="numero(event)">7</button>
            <button onclick="numero(event)">8</button>
            <button onclick="numero(event)">9</button>
            <button onclick="dividir(event)">/</button>

            <button onclick="numero(event)">4</button>
            <button onclick="numero(event)">5</button>
            <button onclick="numero(event)">6</button>
            <button onclick="multiplicar(event)">*</button>

            <button onclick="numero(event)">1</button>
            <button onclick="numero(event)">2</button>
            <button onclick="numero(event)">3</button>
            <button onclick="restar(event)">-</button>

            <button onclick="numero(event)">0</button>
            <button onclick="limpiar()">C</button>
            <button onclick="igual()">=</button>
            <button onclick="sumar(event)">+</button>
        </div>
    </div>

    <script src="javascript-02.js"></script>
</body>
</html>
